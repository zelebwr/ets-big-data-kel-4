services:
  namenode:
    image: apache/hadoop:3
    platform: linux/amd64
    hostname: namenode
    container_name: hadoop-namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
      _JAVA_OPTIONS: "-Xmx128m -XX:+UseG1GC"
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop-namenode:/tmp/hadoop-hadoop/dfs/name
    user: "root"
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      /bin/bash -c "
        if [ ! -f /tmp/hadoop-hadoop/dfs/name/current/VERSION ]; then
          hdfs namenode -format -nonInteractive;
        fi &&
        hdfs namenode
      "

  datanode:
    image: apache/hadoop:3
    platform: linux/amd64
    hostname: datanode
    container_name: hadoop-datanode
    depends_on:
      namenode:
        condition: service_started
    ports:
      - "9864:9864"
      - "9866:9866"
    environment:
      _JAVA_OPTIONS: "-Xmx128m -XX:+UseG1GC"
    env_file:
      - ./hadoop.env
    volumes:
      - hadoop-datanode:/tmp/hadoop-hadoop/dfs/data
    user: "root"
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      /bin/bash -c "
        mkdir -p /tmp/hadoop-hadoop/dfs/data &&
        chown -R hadoop:hadoop /tmp/hadoop-hadoop/dfs/data &&
        su hadoop -c 'hdfs datanode'
      "

  resourcemanager:
    image: apache/hadoop:3
    platform: linux/amd64
    hostname: resourcemanager
    container_name: hadoop-resourcemanager
    depends_on:
      datanode:
        condition: service_started
    ports:
      - "8088:8088"
    environment:
      _JAVA_OPTIONS: "-Xmx128m -XX:+UseG1GC"
    env_file:
      - ./hadoop.env
    deploy:
      resources:
        limits:
          memory: 512M
    command: ["yarn", "resourcemanager"]

  nodemanager:
    image: apache/hadoop:3
    platform: linux/amd64
    hostname: nodemanager
    container_name: hadoop-nodemanager
    depends_on:
      resourcemanager:
        condition: service_started
    ports:
      - "8042:8042"
    environment:
      _JAVA_OPTIONS: "-Xmx128m -XX:+UseG1GC"
    env_file:
      - ./hadoop.env
    deploy:
      resources:
        limits:
          memory: 512M
    command: ["yarn", "nodemanager"]

volumes:
  hadoop-namenode:
  hadoop-datanode:
